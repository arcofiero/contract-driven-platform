# Soda Core checks — Bronze Payments

checks for bronze_payments:

  - row_count > 0:
      name: bronze_payments_has_rows

  - missing_count(payment_id) = 0:
      name: bronze_payments_payment_id_not_null
  - missing_count(order_id) = 0:
      name: bronze_payments_order_id_not_null
  - missing_count(customer_id) = 0:
      name: bronze_payments_customer_id_not_null
  - missing_count(event_date) = 0:
      name: bronze_payments_event_date_not_null

  - invalid_percent(_is_valid) < 10:
      name: bronze_payments_dlq_rate_under_10pct
      valid values: [true]

  - duplicate_count(payment_id) = 0:
      name: bronze_payments_payment_id_unique

  # Amount can be negative in Bronze (fault injection) but not wildly extreme
  - min(amount) >= -100000:
      name: bronze_payments_amount_not_extreme

  - freshness(_ingested_at) < 30m:
      name: bronze_payments_freshness_30min

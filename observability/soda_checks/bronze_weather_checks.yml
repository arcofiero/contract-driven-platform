# Soda Core checks — Bronze Weather

checks for bronze_weather:

  - row_count > 0:
      name: bronze_weather_has_rows

  - missing_count(city) = 0:
      name: bronze_weather_city_not_null
  - missing_count(event_date) = 0:
      name: bronze_weather_event_date_not_null

  - invalid_percent(_is_valid) < 10:
      name: bronze_weather_dlq_rate_under_10pct
      valid values: [true]

  # Physical bounds — Bronze allows intentional violations but not impossible extremes
  - min(temperature) >= -200:
      name: bronze_weather_temperature_not_impossible
  - max(temperature) <= 200:
      name: bronze_weather_temperature_not_impossible_high
  - min(humidity) >= -10:
      name: bronze_weather_humidity_not_impossible
  - max(humidity) <= 110:
      name: bronze_weather_humidity_not_impossible_high

  - freshness(_ingested_at) < 120m:
      name: bronze_weather_freshness_2hr
